---
# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  devenv-base:
    url: github:doot/devenv-base
    flake: true
  nixpkgs:
    follows: devenv-base/nixpkgs
  git-hooks:
    follows: devenv-base/git-hooks
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
  - devenv-base
profile: python
